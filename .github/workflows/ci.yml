name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Host regression tests
        run: ./tests/run.sh
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned SDK and NDK
        run: sdkmanager 'platforms;android-34' 'ndk;28.0.13004108'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Bootstrap the verified Gradle distribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if timeout 90 ./gradlew --version; then
            exit 0
          fi
          echo 'Gradle wrapper download failed; trying the upstream release asset API.'
          properties=gradle/wrapper/gradle-wrapper.properties
          name=$(sed -n 's|^distributionUrl=.*/\(gradle-[^/]*-bin\.zip\)$|\1|p' "$properties")
          test -n "$name"
          version=${name#gradle-}
          version=${version%-bin.zip}
          id=$(timeout 30 gh api "repos/gradle/gradle-distributions/releases/tags/v$version" |
            jq -er --arg name "$name" '.assets[] | select(.name == $name) | .id')
          archive="$RUNNER_TEMP/$name"
          timeout 120 gh api "repos/gradle/gradle-distributions/releases/assets/$id" \
            -H 'Accept: application/octet-stream' > "$archive"
          expected=$(sed -n 's/^distributionSha256Sum=//p' "$properties")
          printf '%s  %s\n' "$expected" "$archive" | sha256sum -c -
          sed -i "s|^distributionUrl=.*|distributionUrl=file://$archive|" "$properties"
      - name: Build module ZIPs
        run: ./gradlew moduleZipRelease moduleZipDebug
      - name: Validate exact packages
        run: |
          python3 tests/test_packaging.py module/build/outputs/zip/*.zip
          cd module/build/outputs/zip
          sha256sum ./*.zip > SHA256SUMS
      - name: Upload modules and checksums
        uses: actions/upload-artifact@v4
        with:
          name: Zygisk-Hide-${{ github.sha }}
          path: |
            module/build/outputs/zip/*.zip
            module/build/outputs/zip/SHA256SUMS
          if-no-files-found: error
